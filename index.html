<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌼Aesthetic Dark Red Journal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400;1,600&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-card: #10141f;
      --bg-sidebar: #0d1019;
      --red-primary: #8b0000;
      --red-accent: #cc1111;
      --line-color: rgba(139, 0, 0, 0.15);
    }

    body {
      background-color: var(--bg-main);
      color: #dcdfe8;
      font-family: 'Montserrat', sans-serif;
    }

    .font-serif-aesthetic {
      font-family: 'Cormorant Garamond', serif;
    }

    .font-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .lined-paper {
      background-size: 100% 2.2rem;
      line-height: 2.2rem;
      background-image: linear-gradient(to bottom, transparent 95%, var(--line-color) 95%);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--red-primary);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex justify-center items-start select-none">

  <div id="root" class="w-full max-w-4xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AestheticJournal() {
      const [entries, setEntries] = useState(() => {
        try {
          const saved = localStorage.getItem('journal_entries');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      
      const [monthNotes, setMonthNotes] = useState(() => {
        try {
          const saved = localStorage.getItem('journal_month_notes');
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }
      });

      const [currentDate, setCurrentDate] = useState(new Date());
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Diario');
      const [view, setView] = useState('editor');

      const currentMonthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

      useEffect(() => {
        localStorage.setItem('journal_entries', JSON.stringify(entries));
      }, [entries]);

      useEffect(() => {
        localStorage.setItem('journal_month_notes', JSON.stringify(monthNotes));
      }, [monthNotes]);

      const handleSaveEntry = () => {
        if (!content.trim() && !title.trim()) return;

        const newEntry = {
          id: Date.now(),
          title: title || 'Sin título',
          content,
          category: selectedCategory,
          date: new Date().toISOString(),
          monthKey: currentMonthKey
        };

        setEntries([newEntry, ...entries]);
        setTitle('');
        setContent('');
      };

      const handleDeleteEntry = (id) => {
        setEntries(entries.filter(entry => entry.id !== id));
      };

      const handleMonthNoteChange = (text) => {
        setMonthNotes({
          ...monthNotes,
          [currentMonthKey]: text
        });
      };

      const handleClearMonth = () => {
        if (window.confirm("¿Seguro que deseas reiniciar las entradas de este mes? Se borrarán del historial activo.")) {
          setEntries(entries.filter(e => e.monthKey !== currentMonthKey));
          setMonthNotes({
            ...monthNotes,
            [currentMonthKey]: ''
          });
        }
      };

      const filteredEntries = entries.filter(e => e.monthKey === currentMonthKey);

      const monthNames = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];

      return (
        <div className="w-full bg-[#10141f] border border-[#8b0000]/30 rounded-xl shadow-[0_0_30px_rgba(139,0,0,0.15)] overflow-hidden flex flex-col md:flex-row min-h-[750px]">
          
          {/* SIDEBAR */}
          <div className="w-full md:w-64 bg-[#0d1019] border-r border-[#8b0000]/20 p-6 flex flex-col justify-between">
            <div>
              <div className="flex items-center space-x-3 mb-8">
                <span className="text-[#cc1111] text-lg">✦</span>
                <h1 className="font-title text-sm tracking-widest text-[#e2e8f0] uppercase">Journal Dark</h1>
              </div>

              {/* Selector de Mes */}
              <div className="mb-8 bg-[#141926] p-3 rounded-lg border border-white/5 flex items-center justify-between">
                <button 
                  onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))}
                  className="text-gray-400 hover:text-[#cc1111] transition px-2"
                >
                  ◀
                </button>
                <span className="font-title text-xs text-[#b8c2d8]">
                  {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                </span>
                <button 
                  onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))}
                  className="text-gray-400 hover:text-[#cc1111] transition px-2"
                >
                  ▶
                </button>
              </div>

              {/* Navegación */}
              <nav className="space-y-2">
                <button
                  onClick={() => setView('editor')}
                  className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-xs tracking-wider transition ${
                    view === 'editor' 
                      ? 'bg-[#8b0000]/20 text-[#ff4d4d] border-l-2 border-[#cc1111]' 
                      : 'text-gray-400 hover:bg-white/5'
                  }`}
                >
                  <span>✏️</span>
                  <span>Escribir Diario</span>
                </button>

                <button
                  onClick={() => setView('history')}
                  className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-xs tracking-wider transition ${
                    view === 'history' 
                      ? 'bg-[#8b0000]/20 text-[#ff4d4d] border-l-2 border-[#cc1111]' 
                      : 'text-gray-400 hover:bg-white/5'
                  }`}
                >
                  <span>📜</span>
                  <span>Historial ({filteredEntries.length})</span>
                </button>

                <button
                  onClick={() => setView('monthly-recap')}
                  className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-xs tracking-wider transition ${
                    view === 'monthly-recap' 
                      ? 'bg-[#8b0000]/20 text-[#ff4d4d] border-l-2 border-[#cc1111]' 
                      : 'text-gray-400 hover:bg-white/5'
                  }`}
                >
                  <span>📖</span>
                  <span>Lectura Mensual</span>
                </button>
              </nav>
            </div>

            {/* Botón Reiniciar Mes */}
            <div className="pt-6 border-t border-white/5">
              <button
                onClick={handleClearMonth}
                className="w-full flex items-center justify-center space-x-2 px-3 py-2 rounded text-[11px] text-red-400/60 hover:text-red-400 hover:bg-red-950/20 transition border border-red-900/20"
              >
                <span>🗑️</span>
                <span>Reiniciar Mes</span>
              </button>
            </div>
          </div>

          {/* PANEL PRINCIPAL */}
          <div className="flex-1 flex flex-col justify-between bg-[#10141f] p-6 md:p-10 relative overflow-y-auto custom-scrollbar">
            
            {/* VISTA 1: EDITOR */}
            {view === 'editor' && (
              <div className="flex flex-col h-full justify-between space-y-6">
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <div className="flex space-x-2">
                      {['Diario', 'Agenda', 'Reflexión'].map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`text-[10px] uppercase tracking-widest px-3 py-1 rounded-full transition ${
                            selectedCategory === cat 
                              ? 'bg-[#8b0000] text-white' 
                              : 'bg-[#181e2e] text-gray-400 hover:text-white'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    <button
                      onClick={handleSaveEntry}
                      className="px-5 py-1.5 bg-[#8b0000] hover:bg-[#a00000] text-white text-xs font-title rounded-md shadow-lg shadow-red-950/50 transition duration-200"
                    >
                      Guardar
                    </button>
                  </div>

                  <input
                    type="text"
                    placeholder="Título de la entrada..."
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    className="w-full bg-transparent font-title text-xl text-[#f1f5f9] placeholder-gray-600 focus:outline-none mb-4 border-b border-white/5 pb-2"
                  />

                  <textarea
                    placeholder="Escribe aquí tu pensamiento, plan o memoria del día..."
                    value={content}
                    onChange={(e) => setContent(e.target.value)}
                    className="w-full h-[380px] bg-transparent font-serif-aesthetic italic font-light text-lg text-[#d8e0f0] placeholder-gray-700 focus:outline-none resize-none lined-paper leading-[2.2rem]"
                  ></textarea>
                </div>

                {/* NOTAS AL FINAL DE LA HOJA */}
                <div className="mt-auto pt-4 border-t border-[#8b0000]/30 bg-[#0b0e17]/50 p-4 rounded-lg">
                  <div className="flex items-center space-x-2 mb-2">
                    <span className="text-[#cc1111] text-xs">📌</span>
                    <span className="font-title text-xs text-[#e2e8f0] uppercase tracking-wider">
                      Notas Clave del Mes ({monthNames[currentDate.getMonth()]})
                    </span>
                  </div>
                  <textarea
                    placeholder="Anota cosas importantes para recordar durante este mes..."
                    value={monthNotes[currentMonthKey] || ''}
                    onChange={(e) => handleMonthNoteChange(e.target.value)}
                    className="w-full bg-transparent text-xs text-gray-300 placeholder-gray-600 focus:outline-none resize-none h-16"
                  ></textarea>
                </div>
              </div>
            )}

            {/* VISTA 2: HISTORIAL */}
            {view === 'history' && (
              <div className="space-y-6">
                <h2 className="font-title text-lg text-[#f1f5f9] border-b border-[#8b0000]/30 pb-3 flex items-center justify-between">
                  <span>Entradas de {monthNames[currentDate.getMonth()]}</span>
                  <span className="text-xs text-gray-500">{filteredEntries.length} registros</span>
                </h2>

                {filteredEntries.length === 0 ? (
                  <div className="text-center py-20 text-gray-600 text-sm">
                    No hay entradas registradas para este mes.
                  </div>
                ) : (
                  <div className="space-y-4">
                    {filteredEntries.map((item) => (
                      <div 
                        key={item.id} 
                        className="p-4 rounded-lg bg-[#141926] border border-white/5 hover:border-[#8b0000]/40 transition group relative"
                      >
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <span className="text-[9px] uppercase tracking-widest text-[#cc1111] font-title mr-2">
                              {item.category}
                            </span>
                            <span className="text-[10px] text-gray-500">
                              {new Date(item.date).toLocaleDateString()}
                            </span>
                          </div>
                          <button
                            onClick={() => handleDeleteEntry(item.id)}
                            className="text-gray-500 hover:text-red-400 transition"
                          >
                            🗑️
                          </button>
                        </div>

                        <h3 className="font-title text-md text-[#e2e8f0] mb-2">{item.title}</h3>
                        <p className="font-serif-aesthetic italic font-light text-sm text-gray-300 whitespace-pre-wrap leading-relaxed">
                          {item.content}
                        </p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 3: LECTURA MENSUAL */}
            {view === 'monthly-recap' && (
              <div className="space-y-8">
                <div>
                  <h2 className="font-title text-xl text-[#f1f5f9]">
                    Resumen de {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                  </h2>
                  <p className="text-xs text-gray-400 mt-1">
                    Lectura continua de tus pensamientos del mes.
                  </p>
                </div>

                {monthNotes[currentMonthKey] && (
                  <div className="bg-[#1a0a0a]/40 border border-[#8b0000]/30 p-4 rounded-lg">
                    <h4 className="font-title text-xs text-[#ff4d4d] uppercase tracking-wider mb-2 flex items-center gap-2">
                      📌 Apuntes Importantes
                    </h4>
                    <p className="text-xs text-gray-300 whitespace-pre-wrap">
                      {monthNotes[currentMonthKey]}
                    </p>
                  </div>
                )}

                <div className="space-y-8 border-l border-[#8b0000]/20 pl-6">
                  {filteredEntries.length === 0 ? (
                    <p className="text-gray-600 text-sm">Sin registros que consolidar este mes.</p>
                  ) : (
                    filteredEntries.map((item) => (
                      <article key={item.id} className="space-y-2">
                        <div className="flex items-center space-x-2 text-[10px] text-[#cc1111] font-title">
                          <span>{new Date(item.date).toLocaleDateString()}</span>
                          <span>•</span>
                          <span>{item.category}</span>
                        </div>
                        <h3 className="font-title text-lg text-white">{item.title}</h3>
                        <p className="font-serif-aesthetic italic font-light text-base text-[#d8e0f0] leading-relaxed lined-paper">
                          {item.content}
                        </p>
                      </article>
                    ))
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AestheticJournal />);
  </script>
</body>
</html>
